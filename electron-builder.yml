appId: com.hongrenguan.ai
productName: 红人馆AI
asar: true
directories:
  output: .desktop-build
  buildResources: build
files:
  - LICENSE
  - README.md
  - dist/**/*
  - desktop/**/*
  - server/**/*
  - shared/**/*
  - package.json
  - node_modules/**/*
afterPack: scripts/verify-desktop-package.cjs
asarUnpack:
  - node_modules/**/*.node
  - node_modules/@img/sharp-*/**/*
  - node_modules/@napi-rs/canvas-*/**/*
  - node_modules/@openai/codex-*/vendor/**/*
artifactName: Hongrenguan-AI-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.graphics-design
  icon: build/icon.png
  identity: null
  target: dmg
dmg:
  title: 红人馆AI ${version}
  writeUpdateInfo: false
win:
  icon: build/icon.png
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  category: Graphics
  icon: build/icon.png
  target:
    - AppImage
